[flake8]
max-line-length = 88
# Ignore: E501 (line too long), F401 (unused import), F722 (syntax error in type), 
# W293/W291 (blank line whitespace), E203 (space before colon), F541 (missing placeholder),
# W503 (line break before operator), F841 (assigned but never used - intentional for UI elements)
# `extend-ignore` et non `ignore` : `ignore` remplace la liste par defaut de
# flake8 (E121,E123,E126,E226,E24,E704,W503,W504) au lieu de s'y ajouter, ce
# qui faisait remonter des E226 que la passe stricte du Makefile, elle, ne
# signalait pas. Les deux passes sont maintenant reglees pareil.
extend-ignore = E501,F401,F722,W293,W291,E203,F541,W503,F841
# exclude external/generated code and data folders
# `finances` et `gui/forms` -- 37 495 lignes, 70 % du code -- etaient exclus
# du lint par defaut. Ils sont desormais couverts : la passe stricte du
# Makefile ne remontait que 11 E402, tous corriges.
exclude = .git,__pycache__,env,.env,venv,.venv,build,dist,TsaraKonta,backups,tests/fixtures,tests/sample_*,.worktrees,templates

[tool:black]
line-length = 88

[isort]
profile = black
# isort n'exclut pas les environnements virtuels par defaut, contrairement a
# black. Sans ces exclusions, `isort .` reecrit site-packages et casse les
# bibliotheques dont l'ordre d'import est significatif (openpyxl, pandas).
skip = .git,__pycache__,env,.env,venv,.venv,build,dist,backups
extend_skip_glob = */site-packages/*,*/.env/*
