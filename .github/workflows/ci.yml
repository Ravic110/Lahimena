name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -e .[financial]
          pip install -r requirements-test.txt
      - name: Run linters
        # `flake8 .` couvre desormais tout le depot : gui/forms et finances,
        # soit 70 % du code, ne sont plus exclus. L'ancienne passe stricte
        # separee et non bloquante n'a donc plus d'objet.
        run: |
          pip install flake8 black isort
          flake8 . --statistics --count
          black --check .
          isort --check-only .
      - name: Check data workbook templates
        # Le poste de CI est un clone frais, sans data.xlsx ni data-hotel.xlsx.
        # L'amorcage doit savoir les recreer depuis les gabarits versionnes.
        run: |
          python scripts/init_data.py init
      - name: Run tests
        # xvfb-run fournit l'affichage dont ont besoin les tests des ecrans de
        # cotation. Sans lui, la fixture tk_root les ignore : la suite reste
        # verte mais le filet sur gui/ ne s'exerce pas.
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run -a pytest --cov=utils --cov=models --cov=gui --cov-report=xml tests/
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
