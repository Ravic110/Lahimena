[pytest]
# Pytest configuration for Lahimena Tours project
testpaths = tests

# Racine du projet sur sys.path, pour que `import config` et `import utils`
# fonctionnent depuis tests/. Mecanisme officiel de pytest (>= 7.0), plus sur
# que la manipulation de sys.path dans conftest.py.
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers for test categorization
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    skip: Tests to skip
    gui: Tests instanciant des widgets Tk (ignores sans affichage)
